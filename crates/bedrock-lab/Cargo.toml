[package]
name = "bedrock-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-level testing and debugging API for the bedrock hypervisor"

[features]
# Serialize/Deserialize for recordings (InputRecording, Tape, VirtTime, ...).
serde = ["dep:serde"]

[dependencies]
bedrock-vm = { path = "../bedrock-vm" }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
bedrock-vmx = { path = "../bedrock-vmx" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
