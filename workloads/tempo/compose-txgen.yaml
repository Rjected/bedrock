services:
  tempo:
    image: bedrock/tempo-localnet:pinned
    container_name: tempo
    network_mode: host
    command: ["--bare", "--block-time", "200ms"]
    environment:
      RUST_LOG: info,reth::engine::tree=debug
  txgen:
    image: bedrock/tempo-txgen:latest
    container_name: txgen
    network_mode: host
    environment:
      TXGEN_COUNT: "1000"
      TXGEN_TPS: "100"
    depends_on: [tempo]
