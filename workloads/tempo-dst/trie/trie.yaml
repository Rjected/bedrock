# Storage-trie collapse workload against RawStorage (raw sstore(slot, value)).
#
# Slots are raw (trie path = keccak256(bytes32(slot))), chosen for shared path
# prefixes:  A=544 -> 120..  B=646 -> 121..  C=131 -> 13..  D=0 -> 2..
# Every sequence starts and ends with empty storage, so instances can repeat
# on the one deployed contract. One sender keeps steps in nonce order.

chain_id: 1337

accounts:
  trie:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 1]

artifacts:
  RawStorage:
    abi: raw-storage.json
    bytecode: raw-storage.json

setup:
  steps:
    - id: store
      deploy:
        type: eip1559
        from: { pool: trie, select: { index: 0 } }
        artifact: RawStorage
        gas_limit: 1000000
        constructor_args: []

templates:
  set_slot:
    type: tempo
    from: { pool: trie, select: { index: 0 } }
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 1000000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    call:
      abi: RawStorage
      function: set
      args: []

sequences:
  # Empty -> leaf -> extension splits -> root branch, then collapses back to empty.
  collapse_abcd:
    steps:
      - { name: a_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 1] } } }
      - { name: b_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 1] } } }
      - { name: c_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 1] } } }
      - { name: d_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [0, 1] } } }
      - { name: a_update, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 2] } } }
      - { name: d_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [0, 0] } } }
      - { name: c_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 0] } } }
      - { name: b_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 0] } } }
      - { name: a_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 0] } } }
  # Same final shapes, opposite split order; deletes in insertion order.
  split_reverse:
    steps:
      - { name: d_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [0, 7] } } }
      - { name: c_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 7] } } }
      - { name: b_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 7] } } }
      - { name: a_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 7] } } }
      - { name: d_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [0, 0] } } }
      - { name: c_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 0] } } }
      - { name: b_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 0] } } }
      - { name: a_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 0] } } }
  # Collapse A/B to a leaf, then re-split it.
  delete_reinsert:
    steps:
      - { name: a_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 3] } } }
      - { name: b_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 3] } } }
      - { name: b_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 0] } } }
      - { name: b_reinsert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 4] } } }
      - { name: a_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [544, 0] } } }
      - { name: b_delete2, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [646, 0] } } }
  # Zero-writes to empty slots and same-value rewrites change nothing.
  noop_writes:
    steps:
      - { name: c_zero_empty, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 0] } } }
      - { name: c_insert, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 5] } } }
      - { name: c_same, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 5] } } }
      - { name: d_zero_empty, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [0, 0] } } }
      - { name: c_delete, template: set_slot, with: { call: { to: { var: setup.store.address }, args: [131, 0] } } }

mix:
  - { sequence: collapse_abcd, weight: 3 }
  - { sequence: split_reverse, weight: 1 }
  - { sequence: delete_reinsert, weight: 1 }
  - { sequence: noop_writes, weight: 1 }
