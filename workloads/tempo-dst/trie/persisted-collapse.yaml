# Regression trigger for paradigmxyz/reth#26843 (see ../regressions/reth-26843).
#
# Branch stack under nibble e, every level stored in the node's trie tables:
#   P = e   (children 1: slot 40, c: slot 61, d: B1)
#   B1 = ed (children 0: slot 1326, 9: B2)
#   B2 = ed9 (children 0: slot 2311, 3: slot 549, 5: B3)
#   B3 = ed95 (slots 325, 370)
# Slot 325 then flips between 1 and 2 every few blocks. A historical proof
# (the oracles' check 128 blocks behind the head) is built from the newer
# persisted trie with 325 marked dirty in a prefix set; before the fix,
# proof v2 dropped B2's clean sibling and returned a wrong storage root
# (E5/multiproof-*, E6/multiproof-*).
# Run with --trie-spec persisted-collapse.yaml --trie-slots 325,370,549,2311,1326,40,61.

chain_id: 1337

accounts:
  trie:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 1]

artifacts:
  RawStorage:
    abi: raw-storage.json
    bytecode: raw-storage.json


templates:
  set_slot:
    type: tempo
    from: { pool: trie, select: { index: 0 } }
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 1000000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    call:
      abi: RawStorage
      function: set
      args: []

sequences:
  # Build (or restore) the full shape; a no-op once it stands.
  shape:
    steps:
      - { name: s325, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [325, 1] } } }
      - { name: s370, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [370, 1] } } }
      - { name: s549, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [549, 1] } } }
      - { name: s2311, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [2311, 1] } } }
      - { name: s1326, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [1326, 1] } } }
      - { name: s40, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [40, 1] } } }
      - { name: s61, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [61, 1] } } }
  # Dirty a key under B2.
  flip:
    steps:
      - { name: s325_two, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [325, 2] } } }
      - { name: s325_one, template: set_slot, with: { call: { to: "0x5FbDB2315678afecb367f032d93F642f64180aa3", args: [325, 1] } } }

mix:
  - { sequence: shape, weight: 1 }
  - { sequence: flip, weight: 8 }
