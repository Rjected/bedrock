[package]
name = "tempo-dst"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-guest nemesis and oracles for Tempo deterministic simulation runs"

# Installed into the guest rootfs at /usr/local/bin/tempo-dst. Runs in the guest
# host namespace (where podman is) and is started per branch by the host driver.
# Built as a static musl binary, like workload-monitor.
[[bin]]
name = "tempo-dst"
path = "src/main.rs"

[dependencies]
bedrock-assertions = { path = "../../crates/bedrock-assertions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["process", "time"] }
rand = "0.9"
# Independent of reth: the E5 storage-root reference must not share its code.
tiny-keccak = { version = "2", features = ["keccak"] }
# Plain HTTP to the local node only; no TLS.
ureq = { version = "2", default-features = false, features = ["json"] }
